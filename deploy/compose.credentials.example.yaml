# Optional overlay: copy to compose.credentials.yaml, keep secret files outside the source archive.
# Create these files empty if not configured; set the matching *_FILE env only when ready.
services:
  web: &credentials
    secrets: [smtp_password, ai_key, e2b_key, runner_key]
  maintenance: *credentials
  media: *credentials
  execution: *credentials
  beat: *credentials
secrets:
  smtp_password: {file: ./secrets/smtp_password}
  ai_key: {file: ./secrets/ai_key}
  e2b_key: {file: ./secrets/e2b_key}
  runner_key: {file: ./secrets/runner_key}
